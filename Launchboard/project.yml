name: Launchboard
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: targeted

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: "1.0.0"

targets:
  Launchboard:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Launchboard
        excludes:
          - Resources/Info.plist
          - Resources/Launchboard.entitlements
    resources:
      - path: Launchboard/Resources/Info.plist
    info:
      path: Launchboard/Resources/Info.plist
      properties:
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2025. All rights reserved."
    entitlements:
      path: Launchboard/Resources/Launchboard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.launchboard
        INFOPLIST_FILE: Launchboard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Launchboard/Resources/Launchboard.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: KeyboardShortcuts
      - package: LaunchAtLogin

  LaunchboardTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - LaunchboardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.launchboard.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: Launchboard
